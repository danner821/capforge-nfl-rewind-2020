name: Verify staff-only cartoon portraits after rejected V21 player IDs (V22)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/coaches_2020_v22_staff_portrait_candidates.json'
      - 'scripts/build_v22_staff_pool_portraits.py'
      - 'scripts/validate_v22_staff_pool_portraits.py'
      - '.github/workflows/v22-valid-staff-portraits.yml'
  pull_request:
    paths:
      - 'data/coaches_2020_v22_staff_portrait_candidates.json'
      - 'scripts/build_v22_staff_pool_portraits.py'
      - 'scripts/validate_v22_staff_pool_portraits.py'
      - '.github/workflows/v22-valid-staff-portraits.yml'

permissions:
  contents: write

concurrency:
  group: capforge-v22-valid-staff-portraits
  cancel-in-progress: false

jobs:
  staff-avatar-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate staff-only ID portraits for seven head coaches
        run: python scripts/build_v22_staff_pool_portraits.py
      - name: Reject V21 player IDs and protect all unchanged staff fields
        run: python scripts/validate_v22_staff_pool_portraits.py
      - name: Publish only separate V22 staff and spoiler-free report on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/staff-2020-valid-coach-portraits-v22.json preview/v22-valid-staff-portrait-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish V22 valid staff-pool portrait candidates"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Unable to publish V22 staff preview" >&2
          exit 1
