name: Audit 2021 offseason static readiness, preserve V19 roster (V26)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_v26_2021_offseason_static.py'
      - 'scripts/validate_v26_2021_offseason_static.py'
      - '.github/workflows/v26-2021-offseason-preflight.yml'
  pull_request:
    paths:
      - 'scripts/audit_v26_2021_offseason_static.py'
      - 'scripts/validate_v26_2021_offseason_static.py'
      - '.github/workflows/v26-2021-offseason-preflight.yml'

permissions:
  contents: write

concurrency:
  group: capforge-v26-2021-offseason-static
  cancel-in-progress: false

jobs:
  offseason-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute first offseason theoretical free agents and 2021 contractual obligations
        run: python scripts/audit_v26_2021_offseason_static.py
      - name: Validate unchanged player file, rookie classes, 2021 cap and no spoiler leakage
        run: python scripts/validate_v26_2021_offseason_static.py
      - name: Publish only spoiler-free V26 static report on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/v26-2021-offseason-static-preflight.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: publish 2021 offseason static preflight; no player changes"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "V26 static audit publication failed" >&2
          exit 1
