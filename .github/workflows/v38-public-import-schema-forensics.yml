name: V38 forensic check of published CapForge development import schemas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_v38_public_import_schema.py'
      - '.github/workflows/v38-public-import-schema-forensics.yml'
      - 'docs/ROADMAP.md'
      - 'docs/LIVE_HANDOFF.md'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_v38_public_import_schema.py'
      - '.github/workflows/v38-public-import-schema-forensics.yml'

permissions:
  contents: write

concurrency:
  group: capforge-v38-schema-forensics
  cancel-in-progress: false

jobs:
  forensic-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check read-only source comparator
        run: python -m py_compile scripts/audit_v38_public_import_schema.py
      - name: Compare pinned V36 with public roster development schemas
        run: python scripts/audit_v38_public_import_schema.py
      - name: Prove no protected input file was modified
        run: |
          git diff --exit-code -- preview/players-2020-nine-class-editor-compatible-growth-v36-TEST.json preview/teams-2020-roofs-v2.json preview/staff-2020-head-coach-video-matched-v25.json
          test -f preview/v38-public-import-development-schema-audit.json
      - name: Publish only forensic aggregate after main CI success
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/v38-public-import-development-schema-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: publish V38 pinned CapForge development schema comparison"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "V38 forensic report publication failed" >&2
          exit 1
