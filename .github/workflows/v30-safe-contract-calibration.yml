name: V30 safe 2020 contract-only calibration (trial import)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_v30_safe_contract_tune.py'
      - 'scripts/validate_v30_safe_contract_tune.py'
      - '.github/workflows/v30-safe-contract-calibration.yml'
      - 'docs/ROADMAP.md'
      - 'docs/LIVE_HANDOFF.md'
  push:
    branches: [main]
    paths:
      - 'scripts/build_v30_safe_contract_tune.py'
      - 'scripts/validate_v30_safe_contract_tune.py'
      - '.github/workflows/v30-safe-contract-calibration.yml'

permissions:
  contents: write

concurrency:
  group: capforge-v30-contracts
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute independently versioned V30 2020 starting contract import
        run: python scripts/build_v30_safe_contract_tune.py
      - name: Validate exact unchanged 4320 prospects, 2020 roster ratings and cap guards
        run: python scripts/validate_v30_safe_contract_tune.py
      - name: Validate general CapForge import schema and every 2020 position group
        run: python scripts/validate_capforge_roster.py preview/players-2020-nine-class-contracts-v30-TEST.json
      - name: Verify historical V19 2020 contracts and V15 protection regression
        run: python scripts/validate_v19_simple_contracts.py
      - name: Publish frozen V30 version ONLY after successful tests on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/players-2020-nine-class-contracts-v30-TEST.json preview/v30-contract-calibration-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish immutable V30 CapForge 2020 contract-only test pack"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "V30 artifact publication failed" >&2
          exit 1
