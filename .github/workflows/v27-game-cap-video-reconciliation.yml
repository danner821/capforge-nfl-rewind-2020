name: Reconcile 2020 and 2021 CapForge user-video cap space to V19 import fields (V27)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/v27-video-team-cap-space-2020-vs-2021.json'
      - 'scripts/audit_v27_game_cap_video_reconciliation.py'
      - 'scripts/validate_v27_game_cap_video_reconciliation.py'
      - '.github/workflows/v27-game-cap-video-reconciliation.yml'
  pull_request:
    paths:
      - 'data/v27-video-team-cap-space-2020-vs-2021.json'
      - 'scripts/audit_v27_game_cap_video_reconciliation.py'
      - 'scripts/validate_v27_game_cap_video_reconciliation.py'
      - '.github/workflows/v27-game-cap-video-reconciliation.yml'

permissions:
  contents: write

concurrency:
  group: capforge-v27-user-video-economics
  cancel-in-progress: false

jobs:
  audit-real-game-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare user-observed 2020/2021 cap space, OVR and source contract salaries vs bonuses
        run: python scripts/audit_v27_game_cap_video_reconciliation.py
      - name: Validate 30-team comparisons and that V19 roster is untouched
        run: python scripts/validate_v27_game_cap_video_reconciliation.py
      - name: Publish only aggregate user-video economics report on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/v27-video-cap-space-reconciliation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: publish V27 real-game cap space vs imported salary/bonus report"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "V27 economics report publish failed" >&2
          exit 1
