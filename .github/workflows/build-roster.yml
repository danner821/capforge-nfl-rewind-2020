name: Build 2020 historical roster previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-roster.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate import candidates
        run: python scripts/build_2020.py
      - name: Check generated JSON
        run: |
          python scripts/validate_capforge_roster.py preview/players-2020-three-class.json preview/players-2020-extended-experimental.json
      - name: Publish preview files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: update Madden 2020 roster and draft class previews"
          git push
